add_newline = false
format = """
[◖](gold)\
[◖](fg:deepblue bg:gold)\
[artorias](bg:deepblue fg:white italic bold)\
[◗](fg:deepblue bg:gold)\
[◗](gold)\
$custom\
$fill\
$directory
$character"""

palette = 'catppuccin_mocha'

[fill]
symbol = ' '

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'

[directory]
truncation_length = 0

[hostname]
ssh_only = false

